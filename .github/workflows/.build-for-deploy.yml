name: Build for deploy

# Lokalt image-bygg (bevisst ikke delt, jf. metarepo-README): next-bygg og docker-image til nais-registryet.
# Kjører ingen tester - det gjøres av .build-and-test.yml.
on:
  workflow_call:
    outputs:
      IMAGE:
        description: "Docker image"
        value: ${{ jobs.build.outputs.IMAGE }}
    secrets:
      READER_TOKEN:
        required: true

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # id-token: write er kun for OIDC-føderasjonen i docker-build-push; GITHUB_TOKEN har bare lesetilgang.
    permissions:
      contents: read
      id-token: write
    outputs:
      IMAGE: ${{ steps.docker-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # Ikke la tokenet ligge igjen i .git/config - stegene kjører avhengigheters kode.
          persist-credentials: false
      # pnpm-versjonen leses fra packageManager-feltet i package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build app
        run: pnpm run build
        env:
          # Statiske assets serveres fra cdn.nav.no (se assetPrefix i next.config.js)
          CDN_ASSET_PREFIX: https://cdn.nav.no/tpts/tiltakspenger-saksbehandling
      # Må kjøre før imaget deployes, slik at assettene er tilgjengelige når ny HTML refererer dem.
      # Sourcemaps (.map) lastes opp sammen med bundlene, slik at nais sin telemetri-collector
      # kan dekode stack-traces fra klientfeil.
      - name: Upload static assets to CDN
        # Versjonsoversikt: https://github.com/nais/deploy/commits/master/actions/cdn-upload
        uses: nais/deploy/actions/cdn-upload/v2@master
        with:
          team: tpts
          source: .next/static
          # upload-cloud-storage beholder mappenavnet (static), så filene havner på
          # cdn.nav.no/tpts/tiltakspenger-saksbehandling/_next/static/...
          destination: tiltakspenger-saksbehandling/_next
      - name: Build and push docker image
        # Versjonsoversikt: https://github.com/nais/docker-build-push/tags
        uses: nais/docker-build-push@main
        id: docker-push
        with:
          team: tpts
