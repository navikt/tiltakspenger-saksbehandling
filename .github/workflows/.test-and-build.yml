name: Test and build

# Lokalt image-bygg (bevisst ikke delt, jf. metarepo-README): kjører hele gaten og bygger+pusher docker-image til nais-registryet.
on:
  workflow_call:
    inputs:
      buildImage:
        required: false
        type: boolean
        default: true
    outputs:
      IMAGE:
        description: "Docker image"
        value: ${{ jobs.build.outputs.IMAGE }}
    secrets:
      READER_TOKEN:
        required: true
      SLACK_VARSEL_WEBHOOK_URL:
        required: true

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      IMAGE: ${{ steps.docker-push.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Ikke la tokenet ligge igjen i .git/config - stegene kjører avhengigheters kode.
          persist-credentials: false
      # pnpm-versjonen leses fra packageManager-feltet i package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Run type checking
        run: pnpm exec tsc --noEmit
      - name: Run linting
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test
      - name: Build app
        run: pnpm run build
      - name: Build and push docker image
        # Versjonsoversikt (tag -> SHA): https://github.com/nais/docker-build-push/tags
        uses: nais/docker-build-push@31c3a7321909bcb20799fdf46153fec721fd9512 # v0
        if: inputs.buildImage == true
        id: docker-push
        with:
          team: tpts
      # All kontekst går via env (aldri ${{ }} direkte i run), og payloaden bygges med jq så verdier med spesialtegn ikke kan knekke/injisere JSON-en.
      # curl -sSf gjør at et avvist webhook-kall feiler steget synlig i stedet for å forsvinne stille.
      # Webhooken er en app-basert Slack-webhook: den krever JSON-body med Content-Type: application/json (legacy payload=-form ga HTTP 422).
      - name: Varsle Slack ved feilet bygg på main
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          payload=$(jq -n --arg text "[$REPO_NAME] Build failed :cry: $AUTHOR - <https://github.com/$REPO/commit/$COMMIT_SHA|$COMMIT_SHA>" '{text: $text}')
          curl -sSf -X POST -H 'Content-type: application/json' --data "$payload" "$WEBHOOK_URL"
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_VARSEL_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          AUTHOR: ${{ github.event.pusher.name }}
          COMMIT_SHA: ${{ github.sha }}
