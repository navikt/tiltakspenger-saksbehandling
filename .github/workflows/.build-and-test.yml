name: Build and test

# Testgaten (bevisst ikke delt, jf. metarepo-README): typesjekk, lint, enhetstester, e2e og next-bygg.
# Bygger ikke docker-image - det gjøres av .build-for-deploy.yml.
on:
  workflow_call:
    secrets:
      READER_TOKEN:
        required: true
      SLACK_VARSEL_WEBHOOK_URL:
        required: true

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # Ikke la tokenet ligge igjen i .git/config - stegene kjører avhengigheters kode.
          persist-credentials: false
      # pnpm-versjonen leses fra packageManager-feltet i package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Run type checking
        run: pnpm exec tsc --noEmit
      - name: Run linting
        run: pnpm run lint
      - name: Run unit tests
        run: pnpm run test

  # E2E kjøres i egne jobber per nettleser, parallelt med jobben over, slik at ventetiden styres av den tregeste nettleseren.
  e2e:
    name: E2E (${{ matrix.prosjekt }})
    runs-on: ubuntu-latest
    # Use Playwright's official image — ships with all browsers and the system
    # libraries they need, so we skip the slow `playwright install-deps` step.
    # NB: keep the image tag in sync with the `@playwright/test` version in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    permissions:
      contents: read
    strategy:
      # Kjør ferdig alle nettlesere selv om én feiler, så vi ser hele bildet.
      fail-fast: false
      matrix:
        prosjekt: [chromium, firefox, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          # Ikke la tokenet ligge igjen i .git/config - stegene kjører avhengigheters kode.
          persist-credentials: false
      # pnpm-versjonen leses fra packageManager-feltet i package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      # Turbopack sin byggecache gjør next build i Playwright sin webServer vesentlig raskere (lokalt 23 s -> 9 s).
      # Egen nøkkelprefiks fordi e2e-bygget (E2E=true) er konfigurert annerledes enn deploy-bygget.
      # Matrise-jobbene bygger likt; bare den første får lagret en ny nøkkel, de andre gir en ufarlig advarsel.
      - name: Cache Next.js build
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', 'next.config.js', 'tsconfig.json') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Run Playwright tests
        run: pnpm run test:e2e --project="$PROSJEKT"
        env:
          CI: true
          PROSJEKT: ${{ matrix.prosjekt }}
          # Required by Firefox when running in the Playwright container image —
          # the checkout step chowns $HOME to a non-root user, but the container
          # runs as root, so we point HOME at /root which root owns.
          HOME: /root
          NODE_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

  varsle-slack:
    name: Varsle Slack ved feilet bygg på main
    needs: [test, e2e]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # All kontekst går via env (aldri ${{ }} direkte i run), og payloaden bygges med jq så verdier med spesialtegn ikke kan knekke/injisere JSON-en.
      # curl -sSf gjør at et avvist webhook-kall feiler steget synlig i stedet for å forsvinne stille.
      # Webhooken er en app-basert Slack-webhook: den krever JSON-body med Content-Type: application/json (legacy payload=-form ga HTTP 422).
      - name: Varsle Slack
        run: |
          payload=$(jq -n --arg text "[$REPO_NAME] Build failed :cry: $AUTHOR - <https://github.com/$REPO/commit/$COMMIT_SHA|$COMMIT_SHA>" '{text: $text}')
          curl -sSf -X POST -H 'Content-type: application/json' --data "$payload" "$WEBHOOK_URL"
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_VARSEL_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REPO_NAME: ${{ github.event.repository.name }}
          AUTHOR: ${{ github.event.pusher.name || github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
