name: Build, push, and deploy to dev (manual)

on:
  workflow_dispatch:

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

# Testgaten og deployen er delte; image-bygget er lokalt (.build-for-deploy.yml) - se
# https://github.com/navikt/tiltakspenger/blob/main/.github/workflows/README.md
jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/.build-and-test.yml
    permissions:
      contents: read
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      SLACK_VARSEL_WEBHOOK_URL: ${{ secrets.SLACK_VARSEL_WEBHOOK_URL }}

  build:
    name: Build and push image
    uses: ./.github/workflows/.build-for-deploy.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev:
    name: Deploy to NAIS (dev)
    needs: [ test, build ]
    uses: navikt/tiltakspenger/.github/workflows/deploy-nais.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      NAIS_ENV: dev
      IMAGE: ${{ needs.build.outputs.IMAGE }}
