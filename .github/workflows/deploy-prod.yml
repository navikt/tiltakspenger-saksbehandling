name: Build and deploy

# Raske påfølgende pushes ga overlappende NAIS-rollouts i backend-repoene (2026-07-16).
# Kjør deployene serielt; ved flere ventende kjøringer vinner den nyeste.
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.env-template'
      - '.gitattributes'
      - '.gitignore'
      - '.husky/**'
      - 'CODEOWNERS'
      - 'docker-compose/**'
      - 'LICENSE'

# Minste privilegium: toppnivået nullstiller alle token-rettigheter, hver jobb deklarerer eksplisitt det den trenger.
permissions: {}

# Testgaten og deployene er delte; image-bygget er lokalt (.build-for-deploy.yml) - se
# https://github.com/navikt/tiltakspenger/blob/main/.github/workflows/README.md
jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/.build-and-test.yml
    permissions:
      contents: read
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
      SLACK_VARSEL_WEBHOOK_URL: ${{ secrets.SLACK_VARSEL_WEBHOOK_URL }}

  build:
    name: Build and push image
    uses: ./.github/workflows/.build-for-deploy.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  deploy-dev:
    name: Deploy to NAIS (dev)
    needs: [ test, build ]
    uses: navikt/tiltakspenger/.github/workflows/deploy-nais.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      NAIS_ENV: dev
      IMAGE: ${{ needs.build.outputs.IMAGE }}

  deploy-prod:
    name: Deploy to NAIS (prod)
    needs: [ test, build ]
    uses: navikt/tiltakspenger/.github/workflows/deploy-nais.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      NAIS_ENV: prod
      IMAGE: ${{ needs.build.outputs.IMAGE }}
