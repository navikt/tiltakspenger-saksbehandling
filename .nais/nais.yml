apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tiltakspenger-saksbehandling
  namespace: tpts
  labels:
    team: tpts
spec:
  image: {{ image }}
  port: 3000
  # Prober følger felles mal, se «Delte konvensjoner» i navikt/tiltakspenger AGENTS.md. Avvik skal begrunnes med kommentar her.
  startup:
    path: /api/isAlive
    initialDelay: 5
    periodSeconds: 5
    failureThreshold: 60
    timeout: 3
  liveness:
    path: /api/isAlive
    periodSeconds: 10
    failureThreshold: 3
    timeout: 3
  readiness:
    path: /api/isReady
    periodSeconds: 5
    failureThreshold: 1
    timeout: 3
  ingresses:
    {{#each ingress}}
      - {{ this }}
    {{/each}}
  replicas:
    min: {{ replicas }}
    max: {{ replicas }}
  env:
  {{#each envs}}
    - name: {{name}}
      value: {{value}}
  {{/each}}
  accessPolicy:
    outbound:
      rules:
        - application: tiltakspenger-saksbehandling-api
          namespace: tpts
          cluster: {{ cluster }}
  azure:
    sidecar:
      enabled: true
      autoLogin: true
    application:
      enabled: true
      tenant: {{ tenant }}
      claims:
        groups:
        {{#each azure.groups}}
           - id: {{this.id}}
        {{/each}}
        extra:
          - "NAVident"
      {{#if replyUrls}}
        replyURLs:
        {{#each replyUrls}}
          - {{ this }}
        {{/each}}
      {{/if}}
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
    logging:
      destinations:
        - id: elastic
        - id: loki