# Tillat byggescript for spesifikke pakker selv om .npmrc har ignore-scripts=true.
# sharp:          native bildebehandling brukt av Next.js sin next/image
# unrs-resolver:  Rust-basert modulresolver brukt av eslint-config-next
# msw:            Mock Service Worker, brukt til å mocke API-kall i e2e-tester (Playwright)
# @parcel/watcher: filovervåker brukt av jest-haste-map. Avslått: install-scriptet bygger kun fra kildekode
#                 ved npm_config_build_from_source=true; ferdigbygde binærer kommer som optionalDependencies.
allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: true
  '@parcel/watcher': false

# en uke
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@navikt/*"
  - "@nais/*"
