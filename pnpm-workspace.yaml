# Tillat byggescript for spesifikke pakker selv om .npmrc har ignore-scripts=true.
# sharp:          native bildebehandling brukt av Next.js sin next/image
# unrs-resolver:  Rust-basert modulresolver brukt av eslint-config-next
# msw:            Mock Service Worker, brukt til å mocke API-kall i e2e-tester (Playwright)
# @parcel/watcher: filovervåker brukt av jest-haste-map. Avslått: install-scriptet bygger kun fra kildekode
#                 ved npm_config_build_from_source=true; ferdigbygde binærer kommer som optionalDependencies.
allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: true
  '@parcel/watcher': false

# en uke
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@navikt/*"
  - "@nais/*"

# Transitive sikkerhetsfikser; versjonsspesifikke per major-linje så ingen linje hopper major.
# brace-expansion: CVE-2026-102276, CVE-2026-102278 (HIGH) og CVE-2026-102277 (MEDIUM), dratt inn via minimatch 3, 9 og 10.
# source-map-js: CVE-2026-93749 (HIGH), dratt inn via postcss og @eslint/css-tree.
# Fjern en override når `pnpm why <pakke> -r` viser at foreldrepakkene selv drar inn fiksversjonen.
overrides:
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  source-map-js@1: ^1.2.2
